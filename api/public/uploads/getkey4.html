<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP License Generator - ocin.id</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        .gen-container {
            background: #ffffff;
            width: 380px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            text-align: center;
        }

        .header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 30px 20px;
            color: white;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #ff5100;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 13px;
            color: #ccc;
        }

        .content {
            padding: 30px 25px;
        }

        .info-text {
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .result-box {
            display: none;
            background: #f9f9f9;
            border: 2px dashed #ddd;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .credential-item {
            margin-bottom: 15px;
        }

        .credential-item:last-child {
            margin-bottom: 0;
        }

        .credential-label {
            font-size: 12px;
            color: #888;
            font-weight: 600;
            text-transform: uppercase;
            display: block;
            margin-bottom: 5px;
        }

        .tier-name {
            font-size: 14px;
            font-weight: 700;
            color: #333;
            background: #e9ecef;
            padding: 5px;
            border-radius: 6px;
        }

        .credential-value {
            font-size: 24px;
            font-weight: 700;
            color: #ff5100;
            letter-spacing: 3px;
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #eee;
            user-select: all;
        }

        /* Tombol Generate */
        .btn-generate {
            width: 100%;
            padding: 15px;
            background: #ff5100;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255, 81, 0, 0.3);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .btn-generate:hover {
            background: #e64a00;
            transform: translateY(-2px);
        }

        /* Tombol Buka Panel */
        .btn-open-panel {
            display: none; 
            width: 100%;
            padding: 15px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
            text-transform: uppercase;
            animation: fadeIn 0.5s ease;
        }

        .btn-open-panel:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .footer {
            padding: 15px;
            font-size: 12px;
            color: #999;
            background: #fafafa;
            border-top: 1px solid #eee;
        }
        
        .footer span { color: #ff5100; font-weight: bold; }
    </style>
</head>
<body>

    <div class="gen-container">
        <div class="header">
            <h1>KLAIM LISENSI</h1>
            <p>Sistem Distribusi Akses VIP</p>
        </div>

        <div class="content">
            <p class="info-text" id="infoText">
                Klik tombol di bawah untuk menampilkan Kode Lisensi eksklusif Anda.
            </p>

            <div class="result-box" id="resultBox">
                <div class="credential-item">
                    <span class="credential-label">Tipe Paket VIP</span>
                    <div class="tier-name" id="resTier">----</div>
                </div>
                <div class="credential-item">
                    <span class="credential-label">Kode Lisensi Anda</span>
                    <div class="credential-value" id="resCode">----</div>
                </div>
            </div>

            <button class="btn-generate" id="genBtn" onclick="processGeneration()">
                <span id="btnText">Tampilkan Lisensi</span>
                <div class="spinner" id="btnSpinner"></div>
            </button>

            <button class="btn-open-panel" id="openPanelBtn" onclick="bukaPanel()">
                Buka Panel VIP
            </button>
        </div>

        <div class="footer">
            Sistem Keamanan by <span>ocin.id</span>
        </div>
    </div>

    <script>
        // =======================================================
        // PENGATURAN KODE LISENSI UNTUK WEBSITE INI
        // Ganti 2 baris ini saja jika kamu menduplikasi file web ini!
        // =======================================================const SETTING_KODE = "OCFVK"; 
        const SETTING_KODE = "OCFVK"; 
        const SETTING_PAKET = "Paket Elite 40K";


        // =======================================================

        function processGeneration() {
            const btn = document.getElementById('genBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('btnSpinner');

            // Sembunyikan hasil lama jika tombol ditekan ulang
            document.getElementById('resultBox').style.display = 'none';
            document.getElementById('openPanelBtn').style.display = 'none';

            // Animasi Loading
            btn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'block';

            setTimeout(() => {
                // Tampilkan Hasil
                showResultUI(SETTING_KODE, SETTING_PAKET);

                // Kembalikan tombol Generate seperti semula agar bisa ditekan lagi
                btn.disabled = false;
                btnText.style.display = 'block';
                spinner.style.display = 'none';
                btnText.innerText = "Tampilkan Ulang";

            }, 1000); // Loading 1 detik
        }

        function showResultUI(kode, paket) {
            document.getElementById('infoText').innerHTML = "<b>BERHASIL!</b> Harap <i>copy/catat</i> kode ini untuk masuk ke Panel VIP.";
            document.getElementById('infoText').style.color = "#28a745"; 
            
            document.getElementById('resCode').innerText = kode;
            document.getElementById('resTier').innerText = paket;
            
            document.getElementById('resultBox').style.display = 'block';
            document.getElementById('openPanelBtn').style.display = 'block';
        }

        function bukaPanel() {
            // Mengarahkan otomatis ke file panel utamamu
            window.location.href = "panelv2.html";
        }
    </script>
</body>
</html>
